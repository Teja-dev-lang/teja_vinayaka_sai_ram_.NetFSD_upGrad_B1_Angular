<div id="container">
    <form action="" (ngSubmit)="adduser()">
        <div class="mb-3">
                <label for="name">Name</label>
                <input type="text" name="name" [(ngModel)]="login.name" class="form-control">
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="text" name="email" [(ngModel)]="login.email" class="form-control">
        </div>
        <Button type="submit" class="btn btn-primary">Submit</Button>
        
    </form>
    <hr>
    <table class="table table-striped">
        <thead>
            <tr>
            <th>Name</th>
            <th>Email</th>
            </tr>
        </thead>
        <tbody>
            @for (user of logins; track $index) {
                <tr>
                    <td>{{ user.name }}</td>
                    <td>{{ user.email }}</td>
                </tr>
            }
            @empty{
                <tr>
                    <td colspan="2" class="text-center text-muted">No Users added yet.</td>
                </tr>
            }
        </tbody>
    </table>
</div>
